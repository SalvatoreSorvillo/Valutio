# Local container server for Valutio.
#
# Serves the source folder as static files and mirrors the Netlify /yq/* market-data
# proxy (Deploy/netlify/functions/yahoo.js), so live stock prices work the same way
# they do in production instead of depending on a public browser proxy.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Development server: never let the browser or the service worker cache a stale build.
  add_header Cache-Control "no-store" always;

  charset utf-8;
  charset_types text/css text/plain text/javascript application/javascript application/json application/manifest+json;

  client_max_body_size 1m;

  # Same-origin Yahoo Finance proxy. The allowed paths match the Netlify function's
  # whitelist exactly; anything else is rejected before it leaves the container.
  location ~ ^/yq/(v[18]/finance/(?:chart|search)/.+|v1/finance/search)$ {
    resolver 127.0.0.11 ipv6=off valid=30s;   # Docker's embedded DNS
    set $yahoo_host query1.finance.yahoo.com;
    set $yahoo_path $1;

    proxy_ssl_server_name on;
    proxy_set_header Host $yahoo_host;
    proxy_set_header Accept "application/json";
    proxy_set_header User-Agent "Mozilla/5.0 Valutio/1.0";
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 9s;
    proxy_read_timeout 9s;
    proxy_pass https://$yahoo_host/$yahoo_path$is_args$args;

    proxy_hide_header Cache-Control;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "no-store" always;
  }

  location /yq/ {
    return 400 "Unsupported market-data path";
  }

  # The whole source folder is mounted, so keep repository metadata out of reach.
  location ~ /\. {
    return 404;
  }

  # nginx's bundled mime.types has no entry for .webmanifest.
  location ~ \.webmanifest$ {
    default_type application/manifest+json;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
